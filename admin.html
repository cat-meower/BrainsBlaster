<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrainsBlaster Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#101417;color:#fff;font-family:Arial,sans-serif}header{padding:14px 18px;background:#151c20;border-bottom:2px solid #7cff4d;display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:#7cff4d;font-size:24px}.wrap{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 58px)}aside{padding:16px;background:#151c20;border-right:2px solid #30383d;overflow:auto}main{background:#20252a}iframe{width:100%;height:100%;border:0}.box{background:#20282d;border:1px solid #485158;border-radius:10px;padding:12px;margin-bottom:12px}input,button{width:100%;padding:9px;border-radius:7px;border:1px solid #555;margin-top:6px}input{background:#111;color:#fff}button{background:#7cff4d;color:#111;font-weight:900;cursor:pointer}button.secondary{background:#2b343a;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.status{font-size:12px;color:#ff7777;min-height:18px;margin-top:5px}.ok{color:#7cff4d}.small{font-size:11px;color:#aaa;line-height:1.4}</style></head><body><header><h1>BRAINBLASTER DEV ADMIN</h1><span class="small">P = normal in-game panel • this page is for development</span></header><div class="wrap"><aside><div class="box"><b>GitHub check</b><div class="small">Enter your GitHub username. This checks the public GitHub account name; it is not full OAuth authentication.</div><input id="user" placeholder="GitHub username"><button id="check">CHECK USER</button><div id="status" class="status"></div></div><div id="controls" style="display:none"><div class="box"><b>Wave control</b><input id="wave" type="number" min="1" value="10"><button id="skip">SKIP TO WAVE</button><button id="clear" class="secondary">CLEAR ZOMBIES</button></div><div class="box"><b>Give upgrade</b><div class="grid"><button data-u="power">Power Blast</button><button data-u="barrel">Bullet Size</button><button data-u="legs">Leg Day</button><button data-u="speed">Speed Shot</button><button data-u="double">Double Barrel</button><button data-u="barrage">Bullet Barrage</button><button data-u="pierce">Pierce</button></div><div class="small" style="margin-top:8px">Upgrades stack. Bullet Size is capped at 3 pickups.</div></div></div></aside><main><iframe id="game" src="index.html"></iframe></main></div><script>const OWNER='cat-meower';const frame=document.getElementById('game');const status=document.getElementById('status');const controls=document.getElementById('controls');const user=document.getElementById('user');function gameEval(code){try{frame.contentWindow.eval(code)}catch(e){status.textContent='Game control error: '+e.message}}document.getElementById('check').onclick=async()=>{const name=user.value.trim();status.className='status';if(!name){status.textContent='Enter a username.';return}try{const r=await fetch('https://api.github.com/users/'+encodeURIComponent(name));if(!r.ok)throw new Error('GitHub user not found');const data=await r.json();if(data.login.toLowerCase()===OWNER){status.className='status ok';status.textContent='Admin unlocked.';controls.style.display='block'}else status.textContent='That username is not the game owner.'}catch(e){status.textContent=e.message}};document.getElementById('skip').onclick=()=>{const w=Math.max(1,parseInt(document.getElementById('wave').value)||1);gameEval('wave='+w+';zombies=[];bullets=[];drops=[];fireBursts=[];between=false;startWave()')};document.getElementById('clear').onclick=()=>gameEval('zombies=[]');document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>gameEval('applyUpgrade('+JSON.stringify(b.dataset.u)+')'));frame.addEventListener('load',()=>{try{gameEval('if(player.barrelStacks===undefined)player.barrelStacks=0')}catch(e){}});</script></body></html>
