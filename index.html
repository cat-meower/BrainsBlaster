<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainsBlaster</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;background:#20252a}
#hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:2px 2px #000;z-index:2}#title{font-size:28px;color:#7cff4d}#stats{font-size:18px;text-align:right}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.8;text-align:center;pointer-events:none;z-index:2}
#cards{position:fixed;left:16px;bottom:48px;display:flex;gap:8px;flex-wrap:wrap;max-width:430px;pointer-events:none;z-index:3}.mini{border:2px solid #fff;border-radius:8px;padding:6px 9px;background:#000b;font-size:12px;font-weight:800}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#26313a,#090b0d);z-index:5}.panel{text-align:center}.panel h1{font-size:72px;margin:0 0 10px;color:#7cff4d;text-shadow:5px 5px #000}.panel p{font-size:18px;opacity:.8}.panel button{margin-top:18px;border:0;border-radius:12px;padding:18px 42px;font-size:24px;font-weight:900;background:#7cff4d;cursor:pointer;box-shadow:0 6px #3d9e27}.panel button:active{transform:translateY(5px);box-shadow:0 1px #3d9e27}
#cheatToggleRow{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;color:#ffcf4a}.switch{position:relative;display:inline-block;width:52px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;cursor:pointer;background:#3a4146;border:2px solid #666;border-radius:28px}.slider:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%}.switch input:checked+.slider{background:#ff9f43}.switch input:checked+.slider:before{transform:translateX(24px)}
#cheats{position:fixed;top:72px;left:16px;width:220px;background:#101417f2;border:2px solid #ff9f43;border-radius:10px;padding:10px;z-index:4;display:none}.open{display:block!important}#cheats button{width:100%;margin:3px 0;padding:7px;border:1px solid #555;border-radius:6px;background:#263238;color:#fff;font-weight:800;cursor:pointer}
</style></head>
<body>
<canvas id="game"></canvas><div id="hud"><div id="title">BRAINBLASTER</div><div id="stats">HP: <span id="hp">100</span> &nbsp; Wave: <span id="wave">1</span> &nbsp; Kills: <span id="kills">0</span></div></div>
<div id="cards"></div><div id="help">WASD / Arrow keys to move • Mouse to aim • Click to shoot</div>
<div id="cheats"><b style="color:#ffcf4a">CHEAT PANEL</b><button data-c="wave">Skip to Wave 10</button><button data-c="clear">Clear Zombies</button><button data-c="heal">Full Heal</button><button data-c="power">Give Power Blast</button><button data-c="barrel">Give Big Barrrel</button><button data-c="legs">Give Leg Day</button><button data-c="speed">Give Speed Shot</button><button data-c="double">Give Double Barrel</button><button data-c="barrage">Give Bullet Barrage</button><button data-c="pierce">Give Pierce</button></div>
<div id="start"><div class="panel"><h1>BRAINBLASTER</h1><p>Survive the waves.</p><div id="cheatToggleRow"><span>CHEATS</span><label class="switch"><input id="cheatToggle" type="checkbox"><span class="slider"></span></label><span id="cheatState">OFF</span></div><button id="play" type="button">PLAY</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const hpEl=document.getElementById('hp'),waveEl=document.getElementById('wave'),killsEl=document.getElementById('kills'),cardsEl=document.getElementById('cards');let W=innerWidth,H=innerHeight,started=false,last=performance.now();
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const mouse={x:W/2,y:H/2,down:false};addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerdown',e=>{if(e.button===0)mouse.down=true});addEventListener('pointerup',e=>{if(e.button===0)mouse.down=false});
const player={x:W/2,y:H/2,r:16,speed:3.5,hp:100,cool:0,damage:1,size:4,bulletSpeed:10,double:false,barrage:0,pierce:0};let bullets=[],zombies=[],drops=[],parts=[],wave=1,kills=0,spawnLeft=5,spawnTimer=0,between=false;const got=new Set();
const info={power:['Power Blast','#ff5a5a'],barrel:['Big Barrrel','#5aa7ff'],legs:['Leg Day','#7cff4d'],speed:['Speed Shot','#c77dff'],double:['Double Barrel','#ffd84d'],barrage:['Bullet Barrage','#ff9f43'],pierce:['Pierce','#e0e0e0']};
const rand=(a,b)=>Math.random()*(b-a)+a,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function startWave(){spawnLeft=5+(wave-1)*3;spawnTimer=0;between=false;waveEl.textContent=wave}
function spawn(){let s=Math.floor(Math.random()*4),x=s===0?rand(0,W):s===1?W+30:-30,y=s===0?-30:s===1?rand(0,H):s===2?H+30:rand(0,H);if(s===3)x=-30;let tank=wave>=2&&Math.random()<(wave===2?.12:wave===3?.28:wave===4?.5:.72);let fast=wave>=6&&!tank&&Math.random()<.22;let grill=wave>=15&&Math.random()<.1;let hp=grill?35:fast?Math.floor(rand(2,5)):tank?Math.floor(rand(13,19)):Math.floor(rand(4,8));let r=grill?34:fast?13:tank?25:17;let sp=grill?rand(.3,.5):fast?rand(1.7,2.35)+wave*.04:tank?rand(.45,.7)+wave*.02:rand(.65,.95)+wave*.035;zombies.push({x,y,r,hp,max:hp,sp,kind:grill?'grill':fast?'fast':tank?'tank':'normal',hit:0})}
function upgrade(t){if(t==='power')player.damage*=1.4;if(t==='barrel')player.size=Math.min(10,player.size+2);if(t==='legs')player.speed+=1.2;if(t==='speed')player.bulletSpeed+=4;if(t==='double')player.double=true;if(t==='barrage')player.barrage=300;if(t==='pierce')player.pierce++;if(t!=='barrage')got.add(t);renderCards()}
function renderCards(){cardsEl.innerHTML='';for(const t of got){let e=document.createElement('div');e.className='mini';e.style.borderColor=info[t][1];e.textContent=info[t][0];cardsEl.appendChild(e)}}
function shoot(){if(player.cool>0||player.hp<=0)return;player.cool=9;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x),aa=player.double?[a-.09,a+.09]:[a];for(const ang of aa)bullets.push({x:player.x+Math.cos(ang)*20,y:player.y+Math.sin(ang)*20,vx:Math.cos(ang)*player.bulletSpeed,vy:Math.sin(ang)*player.bulletSpeed,r:player.size,d:player.damage})}
function burst(x,y,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-2,2),vy:rand(-2,2),life:30})}
function update(dt){if(!started)return;let dx=(keys.has('d')||keys.has('arrowright'))-(keys.has('a')||keys.has('arrowleft')),dy=(keys.has('s')||keys.has('arrowdown'))-(keys.has('w')||keys.has('arrowup'));let l=Math.hypot(dx,dy)||1;player.x=Math.max(16,Math.min(W-16,player.x+dx/l*player.speed*dt));player.y=Math.max(16,Math.min(H-16,player.y+dy/l*player.speed*dt));if(player.barrage>0)player.barrage-=dt;if(mouse.down||player.barrage>0)shoot();player.cool=Math.max(0,player.cool-dt);if(spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnLeft--;spawnTimer=Math.max(10,28-wave*1.5)}}else if(!zombies.length&&!between){between=true;setTimeout(()=>{wave++;startWave()},1200)}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);for(const z of zombies){let a=Math.atan2(player.y-z.y,player.x-z.x);z.x+=Math.cos(a)*z.sp*dt;z.y+=Math.sin(a)*z.sp*dt;if(dist(z,player)<z.r+player.r&&z.hit<=0){player.hp=Math.max(0,player.hp-(z.kind==='grill'?15:z.kind==='fast'?9:6));z.hit=35;burst(player.x,player.y,3)}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hits=0;for(let j=zombies.length-1;j>=0;j--){let z=zombies[j];if(dist(b,z)<b.r+z.r){hits++;z.hp-=b.d;if(z.hp<=0){zombies.splice(j,1);kills++;killsEl.textContent=kills;burst(z.x,z.y,10)}if(hits>player.pierce)break}}if(hits)bullets.splice(i,1)}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}hpEl.textContent=Math.ceil(player.hp)}
function draw(){ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#303a40';for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const b of bullets){ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(const z of zombies){ctx.fillStyle=z.kind==='grill'?'#651818':z.kind==='fast'?'#d94cff':z.kind==='tank'?'#174d28':'#69c94a';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(z.x-15,z.y-26,30,4);ctx.fillStyle='#f55';ctx.fillRect(z.x-15,z.y-26,30*Math.max(0,z.hp/z.max),4)}let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#4f83ff';ctx.fillRect(-14,-14,28,28);ctx.fillStyle='#222';ctx.fillRect(7,-4,22,8);ctx.restore();for(const p of parts){ctx.fillStyle='#ff4d4d';ctx.fillRect(p.x,p.y,4,4)}if(between){ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('WAVE CLEARED',W/2,H/2)}if(player.hp<=0){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f55';ctx.font='bold 56px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Press R to restart',W/2,H/2+25)}}
function cheat(t){if(t==='wave'){wave=10;zombies=[];startWave()}else if(t==='clear')zombies=[];else if(t==='heal')player.hp=100;else upgrade(t)}
function setCheats(on){document.getElementById('cheatState').textContent=on?'ON':'OFF';document.getElementById('cheats').classList.toggle('open',on)}
document.getElementById('cheatToggle').addEventListener('change',e=>setCheats(e.target.checked));document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>cheat(b.dataset.c)));
document.getElementById('play').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(started)return;started=true;document.getElementById('start').remove();startWave()});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&player.hp<=0){player.x=W/2;player.y=H/2;player.hp=100;player.speed=3.5;player.damage=1;player.size=4;player.bulletSpeed=10;player.double=false;player.barrage=0;player.pierce=0;bullets=[];zombies=[];parts=[];got.clear();renderCards();wave=1;kills=0;killsEl.textContent=0;startWave()}});
function loop(t){let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
