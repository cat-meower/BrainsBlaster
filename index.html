<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainsBlaster</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;background:#20252a}
#hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:2px 2px #000;z-index:2}#title{font-size:28px;color:#7cff4d}#stats{font-size:18px;text-align:right}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.8;text-align:center;pointer-events:none;z-index:2}
#cards{position:fixed;left:16px;bottom:48px;display:flex;gap:8px;flex-wrap:wrap;max-width:430px;pointer-events:none;z-index:3}.mini-card{border:2px solid #fff;border-radius:8px;padding:6px 9px;background:rgba(0,0,0,.7);font-size:12px;font-weight:800;text-shadow:1px 1px #000}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#26313a,#090b0d);z-index:5}.panel{text-align:center}.panel h1{font-size:72px;margin:0 0 10px;color:#7cff4d;text-shadow:5px 5px #000}.panel p{font-size:18px;opacity:.8}.panel button{margin-top:18px;border:0;border-radius:12px;padding:18px 42px;font-size:24px;font-weight:900;background:#7cff4d;cursor:pointer;box-shadow:0 6px #3d9e27}.panel button:active{transform:translateY(5px);box-shadow:0 1px #3d9e27}
#cheatToggleRow{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:15px;color:#ffcf4a}.switch{position:relative;display:inline-block;width:52px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;cursor:pointer;background:#3a4146;border:2px solid #666;border-radius:28px;transition:.2s}.slider:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#ff9f43;border-color:#ffcf4a}.switch input:checked+.slider:before{transform:translateX(24px)}
#cheats{position:fixed;top:72px;left:16px;width:220px;background:rgba(16,20,23,.94);border:2px solid #ff9f43;border-radius:10px;padding:10px;z-index:4;display:none;box-shadow:0 6px 20px rgba(0,0,0,.45)}#cheats.open{display:block}#cheats h3{margin:0 0 8px;color:#ffcf4a;font-size:16px}#cheats button{width:100%;margin:3px 0;padding:7px 8px;border:1px solid #555;border-radius:6px;background:#263238;color:#fff;font-weight:800;cursor:pointer}#cheats button:hover{background:#34424a}#cheats .note{font-size:10px;color:#aaa;margin-top:6px;line-height:1.3}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="title">BRAINBLASTER</div><div id="stats">HP: <span id="hp">100</span> &nbsp; Wave: <span id="wave">1</span> &nbsp; Kills: <span id="kills">0</span></div></div>
<div id="cards"></div>
<div id="help">WASD / Arrow keys to move • Mouse to aim • Click to shoot</div>
<div id="cheats"><h3>CHEAT PANEL</h3><button data-cheat="wave">Skip to Wave 10</button><button data-cheat="clear">Clear Zombies</button><button data-cheat="heal">Full Heal</button><button data-cheat="power">Give Power Blast</button><button data-cheat="barrel">Give Big Barrrel</button><button data-cheat="legs">Give Leg Day</button><button data-cheat="speed">Give Speed Shot</button><button data-cheat="double">Give Double Barrel</button><button data-cheat="barrage">Give Bullet Barrage</button><button data-cheat="pierce">Give Pierce</button><div class="note">Cheats are local to this game session and are enabled from the start screen.</div></div>
<div id="start"><div class="panel"><h1>BRAINBLASTER</h1><p>Survive the waves.</p><div id="cheatToggleRow"><span>CHEATS</span><label class="switch"><input id="cheatToggle" type="checkbox"><span class="slider"></span></label><span id="cheatState">OFF</span></div><button id="play">PLAY</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const hpEl=document.getElementById('hp'),waveEl=document.getElementById('wave'),killsEl=document.getElementById('kills'),cardsEl=document.getElementById('cards');
const cheatToggle=document.getElementById('cheatToggle'),cheatState=document.getElementById('cheatState'),cheatsEl=document.getElementById('cheats');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const mouse={x:W/2,y:H/2,down:false};addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerdown',e=>{if(e.button===0)mouse.down=true});addEventListener('pointerup',e=>{if(e.button===0)mouse.down=false});
const player={x:W/2,y:H/2,r:16,speed:3.5,hp:100,cool:0,damage:1,bulletSize:4,bulletSpeed:10,doubleBarrel:false,barrage:0,pierce:0};
let bullets=[],zombies=[],particles=[],drops=[],fireBursts=[],wave=1,kills=0,spawnLeft=5,spawnTimer=0,between=false,last=performance.now();
const upgradeInfo={
 power:{name:'Power Blast',desc:'Damage x1.4',color:'#ff5a5a'},
 barrel:{name:'Big Barrrel',desc:'Bigger projectiles',color:'#5aa7ff'},
 legs:{name:'Leg Day',desc:'Move faster',color:'#7cff4d'},
 speed:{name:'Speed Shot',desc:'Faster projectiles',color:'#c77dff'},
 double:{name:'Double Barrel',desc:'Fires two projectiles',color:'#ffd84d'},
 barrage:{name:'Bullet Barrage',desc:'Auto shoots for 5 seconds',color:'#ff9f43'},
 pierce:{name:'Pierce',desc:'Bullets hit +1 zombie',color:'#e0e0e0'}
};
const collected=new Set();
function rand(a,b){return Math.random()*(b-a)+a}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawnZombie(){let side=Math.floor(Math.random()*4),x,y;if(side===0){x=rand(0,W);y=-30}else if(side===1){x=W+30;y=rand(0,H)}else if(side===2){x=rand(0,W);y=H+30}else{x=-30;y=rand(0,H)}
 let tank=false;
 if(wave===2)tank=Math.random()<0.12;
 else if(wave===3)tank=Math.random()<0.28;
 else if(wave===4)tank=Math.random()<0.50;
 else if(wave>=5)tank=Math.random()<0.72;
 let speedster=wave>=6&&!tank&&Math.random()<0.22;let grill=wave>=15&&Math.random()<0.10;let hp=grill?35:(speedster?Math.floor(rand(2,5)):(tank?Math.floor(rand(13,19)):Math.floor(rand(4,8)));let r=grill?34:(speedster?13:(tank?25:17));let speed=grill?rand(.3,.5):(speedster?rand(1.7,2.35)+wave*.04:(tank?rand(.45,.7)+wave*.02:rand(.65,.95)+wave*.035));zombies.push({x,y,r,speed,hp,maxHp:hp,hit:0,tank,speedster,grill,flameCooldown:90})}
function startWave(){spawnLeft=5+(wave-1)*3;spawnTimer=0;between=false;waveEl.textContent=wave}
function dropUpgrade(x,y){
 let roll=Math.random()*100,type=null;
 if(roll<1&&!collected.has('double'))type='double';
 else if(roll<4)type='power';
 else if(roll<7)type='barrel';
 else if(roll<10)type='legs';
 else if(roll<13)type='speed';
 else if(roll<16)type='barrage';
 else if(roll<17&&!collected.has('pierce'))type='pierce';
 if(type)drops.push({x,y,r:15,type,bob:rand(0,Math.PI*2),life:600})
}
function applyUpgrade(type){if(type==='power'){player.damage*=1.4;collected.add(type)}else if(type==='barrel'){player.bulletSize=Math.min(10,player.bulletSize+2);collected.add(type)}else if(type==='legs'){player.speed+=1.2;collected.add(type)}else if(type==='speed'){player.bulletSpeed+=4;collected.add(type)}else if(type==='double'){player.doubleBarrel=true;collected.add(type)}else if(type==='barrage'){player.barrage=300}else if(type==='pierce'){player.pierce+=1;collected.add(type)}updateCards()}
function updateCards(){cardsEl.innerHTML='';for(const type of collected){const info=upgradeInfo[type];const el=document.createElement('div');el.className='mini-card';el.style.borderColor=info.color;el.textContent=info.name;cardsEl.appendChild(el)}}
function cheatAction(type){if(type==='wave'){wave=10;zombies=[];bullets=[];drops=[];fireBursts=[];between=false;startWave()}else if(type==='clear'){zombies=[]}else if(type==='heal'){player.hp=100;hpEl.textContent=100}else applyUpgrade(type)}
function setCheatsEnabled(enabled){cheatState.textContent=enabled?'ON':'OFF';cheatState.style.color=enabled?'#7cff4d':'#ff7777';cheatsEl.classList.toggle('open',enabled)}
cheatToggle.addEventListener('change',()=>setCheatsEnabled(cheatToggle.checked));
for(const button of document.querySelectorAll('[data-cheat]'))button.addEventListener('click',()=>cheatAction(button.dataset.cheat));
function shoot(){if(player.cool>0||player.hp<=0)return;player.cool=9;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);let angles=player.doubleBarrel?[a-0.09,a+0.09]:[a];for(const angle of angles)bullets.push({x:player.x+Math.cos(angle)*20,y:player.y+Math.sin(angle)*20,vx:Math.cos(angle)*player.bulletSpeed,vy:Math.sin(angle)*player.bulletSpeed,r:player.bulletSize,damage:player.damage})}
function burst(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-2,2),vy:rand(-2,2),life:rand(15,35)})}
function update(dt){
 let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);let dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let len=Math.hypot(dx,dy)||1;player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));
 if(player.barrage>0)player.barrage-=dt;
 if(mouse.down||player.barrage>0)shoot();if(player.cool>0)player.cool-=dt;
 if(spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawnZombie();spawnLeft--;spawnTimer=Math.max(10,28-wave*1.5)}}else if(zombies.length===0&&!between){between=true;setTimeout(()=>{wave++;startWave()},1200)}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
 bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 for(const z of zombies){let a=Math.atan2(player.y-z.y,player.x-z.x);z.x+=Math.cos(a)*z.speed*dt;z.y+=Math.sin(a)*z.speed*dt;z.hit=Math.max(0,z.hit-dt);if(z.grill){z.flameCooldown-=dt;if(z.flameCooldown<=0&&dist(z,player)<85){fireBursts.push({x:z.x,y:z.y,r:42,life:24,maxLife:24,damage:7});z.flameCooldown=90;burst(z.x,z.y,14)}}if(dist(z,player)<z.r+player.r&&z.hit<=0){player.hp=Math.max(0,player.hp-(z.grill?15:(z.speedster?9:6)));z.hit=35;burst(player.x,player.y,3)}}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hits=0;for(let j=zombies.length-1;j>=0;j--){let z=zombies[j];if(dist(b,z)<b.r+z.r){hits++;z.hp-=b.damage;z.hit=5;if(z.hp<=0){zombies.splice(j,1);kills++;dropUpgrade(z.x,z.y);burst(z.x,z.y,12);killsEl.textContent=kills}if(hits>player.pierce)break}}if(hits>0)bullets.splice(i,1)}
 for(let i=fireBursts.length-1;i>=0;i--){const f=fireBursts[i];f.life-=dt;if(f.life<=0){fireBursts.splice(i,1);continue}if(dist(f,player)<f.r+player.r){player.hp=Math.max(0,player.hp-f.damage);f.life=0;burst(player.x,player.y,5)}}
 for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.life-=dt;d.bob+=0.06*dt;if(d.life<=0){drops.splice(i,1);continue}if(dist(d,player)<d.r+player.r+4){applyUpgrade(d.type);drops.splice(i,1);burst(d.x,d.y,7)}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
 hpEl.textContent=Math.ceil(player.hp);if(player.hp<=0){mouse.down=false;player.barrage=0;document.getElementById('help').textContent='You got eaten. Press R to restart.'}
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#303a40';ctx.lineWidth=1;for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const d of drops){const info=upgradeInfo[d.type];const bob=Math.sin(d.bob)*3;ctx.save();ctx.translate(d.x,d.y+bob);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-18,12,36,5);ctx.fillStyle='#15191c';ctx.fillRect(-24,-30,48,60);ctx.strokeStyle=info.color;ctx.lineWidth=3;ctx.strokeRect(-24,-30,48,60);ctx.fillStyle=info.color;ctx.fillRect(-20,-26,40,18);ctx.fillStyle='#111';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillText(info.name.toUpperCase(),0,-13);ctx.fillStyle='#fff';ctx.font='bold 7px Arial';ctx.fillText(info.desc,0,5);ctx.font='bold 6px Arial';ctx.fillText('PICK UP',0,18);ctx.restore()}
 for(const b of bullets){ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
 for(const f of fireBursts){ctx.save();ctx.globalAlpha=f.life/f.maxLife;ctx.fillStyle='#ff6b1a';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-f.life/(f.maxLife*2)),0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd447';ctx.beginPath();ctx.arc(f.x,f.y,f.r*.55*(1-f.life/(f.maxLife*3)),0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const z of zombies){ctx.fillStyle=z.hit>0?'#fff':(z.grill?'#651818':(z.tank?'#174d28':(z.speedster?'#d94cff':'#69c94a')));ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(z.x-6,z.y-3,3,0,Math.PI*2);ctx.arc(z.x+6,z.y-3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b22';ctx.fillRect(z.x-9,z.y+7,18,3);ctx.fillStyle='#111';ctx.fillRect(z.x-15,z.y-26,30,4);ctx.fillStyle='#ff5555';ctx.fillRect(z.x-15,z.y-26,30*(z.hp/z.maxHp),4)}
 let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#4f83ff';ctx.fillRect(-14,-14,28,28);ctx.fillStyle='#222';ctx.fillRect(7,-4,22,8);ctx.restore();
 for(const p of particles){ctx.fillStyle='#ff4d4d';ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
 if(player.barrage>0){ctx.fillStyle='#ff9f43';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText('BULLET BARRAGE '+(player.barrage/60).toFixed(1)+'s',W/2,48)}
 if(between){ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('WAVE CLEARED',W/2,H/2)}
 if(player.hp<=0){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff5555';ctx.font='bold 56px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.font='bold 20px Arial';ctx.fillStyle='#fff';ctx.fillText('Press R to restart',W/2,H/2+25)}
}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&player.hp<=0){player.x=W/2;player.y=H/2;player.hp=100;player.speed=3.5;player.damage=1;player.bulletSize=4;player.bulletSpeed=10;player.doubleBarrel=false;player.barrage=0;player.pierce=0;bullets=[];zombies=[];particles=[];drops=[];fireBursts=[];collected.clear();updateCards();wave=1;kills=0;killsEl.textContent=0;startWave();document.getElementById('help').textContent='WASD / Arrow keys to move • Mouse to aim • Click to shoot'}});
document.getElementById('play').onclick=()=>{document.getElementById('start').remove();startWave()};
function loop(t){let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
